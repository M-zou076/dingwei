<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>校园人流模拟后台</title>
  <style>
    :root{--ink:#12372d;--green:#08775a;--lime:#c8ef76;--paper:#f3f7f3;--line:#d9e5df;--red:#e44646;--amber:#e8a52d}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,"Microsoft YaHei",sans-serif}
    header{background:#fff;border-bottom:1px solid var(--line);padding:22px clamp(18px,5vw,64px)}h1{margin:0 0 5px;font-size:26px}header p{margin:0;color:#64756f}
    main{max-width:1240px;margin:auto;padding:24px;display:grid;grid-template-columns:340px 1fr;gap:22px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 10px 28px #173d3010}
    label{display:block;font-weight:700;margin:18px 0 8px}.count{display:flex;align-items:center;gap:12px}.count input[type=range]{flex:1}.count output{font-size:25px;font-weight:800;width:58px;text-align:right}
    select,input[type=number]{width:100%;border:1px solid #b9cbc3;border-radius:12px;padding:12px;background:#fff;color:var(--ink);font-size:15px}
    .buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}button{border:0;border-radius:13px;padding:13px;font-size:15px;font-weight:800;cursor:pointer}.start{background:var(--lime);color:var(--ink)}.stop{background:#eef3f0;color:#a43636}.status{margin-top:16px;border-radius:13px;background:#edf7f2;padding:13px;line-height:1.6}.status.running{background:#e2f5d6}.note{font-size:13px;color:#687a73;line-height:1.7;margin-top:15px}
    .map-title{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:14px}.map-title h2{margin:0;font-size:20px}.badge{padding:7px 11px;border-radius:99px;background:#e7f2ed;font-size:13px;font-weight:700}
    #map{position:relative;overflow:hidden;border-radius:14px;background:#dfe5df;aspect-ratio:1.55;cursor:crosshair}#map>img{width:100%;height:100%;object-fit:fill;display:block}#map:before{content:"";position:absolute;left:12.8%;top:37.5%;width:4.1%;height:5.3%;background:#5b5858}.people-dots{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.target{position:absolute;width:24px;height:24px;border:4px solid #fff;border-radius:50%;background:#2176ff;box-shadow:0 0 0 10px #2176ff42;transform:translate(-50%,-50%);pointer-events:none}.legend{margin-top:13px;font-size:13px;color:#60716b;line-height:1.6}.legend b{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin-right:4px}.density-summary{padding:10px 12px;margin-top:11px;background:#edf7f2;border-radius:10px;font-size:14px}
    @media(max-width:820px){main{grid-template-columns:1fr;padding:14px}.card{padding:17px}}
  </style>
</head>
<body>
  <header><h1>校园人流模拟后台</h1><p>课程答辩专用 · 选择人数和分布方式，模拟数据会持续保存在云端。</p></header>
  <main>
    <section class="card">
      <h2>模拟参数</h2>
      <label for="count">模拟人数</label>
      <div class="count"><input id="count" type="number" min="1" max="10000" value="1000"><output id="countOut">1000</output></div>
      <label for="mode">人员分布方式</label>
      <select id="mode">
        <option value="random">全校随机分布</option>
        <option value="clusters">多个热点聚集</option>
        <option value="point">围绕地图选点聚集</option>
      </select>
      <div class="buttons"><button class="start" id="start">启动 / 更新模拟</button><button class="stop" id="stop">停止并清空</button></div>
      <div class="status" id="status">正在读取云端状态…</div>
      <p class="note">可设置 1–10000 人。热点模式约 65% 人员聚集，另外约 35% 分布于校园各处；选点模式先在地图上点击校园内的位置。模拟数据保存在云端，点击“停止并清空”才会结束。</p>
    </section>
    <section class="card">
      <div class="map-title"><h2>模拟结果预览</h2><span class="badge" id="active">0 人在线</span></div>
      <div id="map"><img src="/maps/csuft-campus.jpg?v=pdf-west-20261013" alt="新版校园地图"><canvas class="people-dots" id="density" aria-label="人流密度预览"></canvas><canvas class="people-dots" id="peopleDots" aria-label="人流位置预览"></canvas><span class="target" id="target" style="left:50%;top:50%;display:none"></span></div>
      <div class="density-summary" id="densitySummary">正在计算模拟密度…</div>
      <div class="legend"><b style="background:#21a76c"></b>较少　<b style="background:#f4b434"></b>一般　<b style="background:#eb514a"></b>较密。柔和色团表示密度，不是矩形区域；小红点表示模拟位置。</div>
    </section>
  </main>
  <script>
    const $=s=>document.querySelector(s), map=$('#map'), target=$('#target');
    let centerX=.5,centerY=.5;
    $('#count').oninput=e=>$('#countOut').value=e.target.value;
    map.onclick=e=>{const r=map.getBoundingClientRect();centerX=(e.clientX-r.left)/r.width;centerY=(e.clientY-r.top)/r.height;target.style.left=`${centerX*100}%`;target.style.top=`${centerY*100}%`;target.style.display='block';$('#mode').value='point'};
    $('#mode').onchange=e=>{target.style.display=e.target.value==='point'?'block':'none'};
    async function command(action){
      const count=Math.round(Number($('#count').value));
      if(action!=='stop'&&(!Number.isFinite(count)||count<1||count>10000)){$('#status').textContent='请输入 1–10000 人';return}
      const body={action,schoolId:'csuft',count,mode:$('#mode').value,centerX,centerY,seed:crypto.randomUUID()};
      $('#status').textContent='正在连接云端…';
      try{const r=await fetch('/api/v1/simulation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){const error=await r.json().catch(()=>({}));throw new Error(error.error||`HTTP ${r.status}`)}await refresh()}catch(e){$('#status').className='status';$('#status').textContent=`操作失败：${e.message}`}
    }
    $('#start').onclick=()=>command('start');$('#stop').onclick=()=>command('stop');
    async function refresh(){
      try{
        const r=await fetch('/api/v1/crowd?schoolId=csuft',{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const data=await r.json();
        const rect=map.getBoundingClientRect(),ratio=window.devicePixelRatio||1;
        for(const canvas of [$('#density'),$('#peopleDots')]){canvas.width=Math.round(rect.width*ratio);canvas.height=Math.round(rect.height*ratio)}
        const dots=data.dots||[],grids=data.grids||[];
        const maxCount=Math.max(1,...grids.map(grid=>grid.count));
        const heat=$('#density').getContext('2d');heat.scale(ratio,ratio);
        for(const grid of grids){
          if(grid.count<2)continue;
          const strength=grid.count/maxCount,x=(grid.x+grid.width/2)*rect.width,y=(grid.y+grid.height/2)*rect.height;
          const radius=Math.max(grid.width*rect.width,grid.height*rect.height)*1.65;
          const color=strength>.72?'235,81,74':strength>.42?'244,180,52':'33,167,108';
          const gradient=heat.createRadialGradient(x,y,0,x,y,radius);
          gradient.addColorStop(0,`rgba(${color},${(.10+.22*strength).toFixed(2)})`);
          gradient.addColorStop(.55,`rgba(${color},${(.05+.11*strength).toFixed(2)})`);
          gradient.addColorStop(1,`rgba(${color},0)`);
          heat.fillStyle=gradient;heat.beginPath();heat.arc(x,y,radius,0,Math.PI*2);heat.fill();
        }
        const ctx=$('#peopleDots').getContext('2d');ctx.scale(ratio,ratio);ctx.fillStyle='rgba(211,39,50,.62)';
        const radius=dots.length>3000?1:1.65;
        for(const dot of dots){ctx.beginPath();ctx.arc(dot.x*rect.width,dot.y*rect.height,radius,0,Math.PI*2);ctx.fill()}
        $('#active').textContent=`模拟 ${data.simulatedUsers||0} · 真实 ${data.realUsers||0}`;
        $('#densitySummary').textContent=dots.length?`当前展示 ${dots.length} 个匿名／模拟位置；最密局部约 ${maxCount} 人。颜色显示相对密度，热点外仍有人。`:'暂无可显示的人流位置';
        const sim=data.simulation||{};$('#status').className=`status${sim.running?' running':''}`;$('#status').textContent=sim.running?`模拟运行中：${sim.count} 人 · ${ {random:'全校随机',clusters:'多个热点',point:'选点聚集'}[sim.mode]||sim.mode }`:'模拟已停止，当前仅显示真实用户';
      }catch(e){$('#status').className='status';$('#status').textContent=`云端读取失败：${e.message}`}
    }
    refresh();setInterval(refresh,5000);
  </script>
</body>
</html>
